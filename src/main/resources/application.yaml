spring:
  application:
    name: security-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logitrack}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: 

server:
  port: 8081

security:
    jwt:
      private-key-path: classpath:certs/private.pem
      public-key-path: classpath:certs/public.pem
      issuer: security-styx