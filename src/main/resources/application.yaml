spring:
  application:
    name: security-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logitrack_security}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_LOCATION:file:/run/secrets/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION:file:/run/secrets/jwt-public.pem}
    issuer: ${JWT_ISSUER:logitrack-security}
